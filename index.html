<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpineJS examples</title>
    <link rel="stylesheet" href="/style/css/main.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
</head>
<body>
    <div id="app"></div>
    <!-- Classic scripts: core, custom components, application, then startup. -->
    <script src="/src/fetch.js"></script>
    <script src="/src/render.js"></script>
    <script src="/src/component.js"></script>
    <script src="/src/state.js"></script>
    <script src="/src/route.js"></script>
    <script src="/src/spine.js"></script>
    <script src="/Example/custom/table.js"></script>
    <script src="/Example/custom/nav.js"></script>
    <script src="/Example/custom/counter.js"></script>
    <script src="/index.js"></script>
    <script>
        const state = new State();
        state.set("current_url_hash", window.location.hash.slice(1) || "home");

        new BaseSpine().then(spine => {
            window.addEventListener("hashchange", () => {
                const route = window.location.hash.slice(1) || "home";
                state.set("current_url_hash", route);
                spine.setActiveRoute(route);
                spine.renderRoute();
            });
            spine.renderRoute();
        });
    </script>
</body>
</html>
